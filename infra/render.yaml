services:
  - type: web
    name: maybanhang-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 4 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: SECRET_KEY
        sync: false   # Set manually in Render dashboard
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
