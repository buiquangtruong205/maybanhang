services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vending-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: vending_machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d vending_machine" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vending-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use Docker service name 'db'
      DATABASE_URL: postgresql://postgres:123456@db:5432/vending_machine
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"
    volumes:
      # Mount for development hot-reload (optional, remove in production)
      - ./backend:/app/backend

  # Nginx Reverse Proxy (serves static files from backend)
  nginx:
    image: nginx:alpine
    container_name: vending-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./backend/app/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: vending-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  postgres_data:
